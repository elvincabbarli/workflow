name: Node.js Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Layihəni götür
        uses: actions/checkout@v6

      - name: Node.js hazırla
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Testləri işə sal
        run: npm test