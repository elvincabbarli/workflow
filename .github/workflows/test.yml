name: Node.js Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Layihəni götür
        uses: actions/checkout@v6

      - name: Node.js hazırla
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Paketləri quraşdır
        run: npm ci

      - name: Lint yoxlaması
        run: npm run lint

      - name: Testləri işə sal
        run: npm test

      - name: Build yarat
        run: npm run build